urface text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface px-margin-mobile"><div class="flex flex-col w-full pb-10">
<div class="flex flex-col w-full bg-surface-container-lowest p-5 rounded-none shadow-md space-y-6 transition-all duration-300" id="battle-poster">
<div class="flex flex-col space-y-2">

<div class="h-px w-full bg-surface-container-highest my-1"></div>
<div class="flex flex-col pt-1">
<div class="flex items-baseline justify-between">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight font-bold">对局战报</h1>
<span class="font-body-sm text-body-sm text-secondary">八轮已竞 · 四十五分钟</span>
</div>

</div>
</div>
<div class="flex flex-col bg-surface-container-low p-5 space-y-4">
<div class="flex justify-between items-start">
<div class="flex flex-col space-y-1">
<div class="flex items-center space-x-1.5">
<span class="bg-primary text-on-primary font-code text-label-sm px-1.5 py-0.5 leading-none">头名</span>
<span class="font-body-sm text-body-sm text-secondary">本场胜家</span>
</div>
<div class="font-headline-md text-headline-md text-primary font-bold tracking-tight pt-1">林夕</div>
</div>
<div class="flex flex-col items-end">

<span class="font-display-mobile text-display-mobile text-primary font-bold tracking-tighter leading-none mt-1">+35</span>
</div>
</div>
<div class="h-px w-full bg-surface-container-highest"></div>

</div>
<div class="flex flex-col space-y-2">
<div class="flex justify-between items-center px-1">
<span class="font-label-md text-label-md text-primary font-bold tracking-wide">全员终局席位</span>

</div>
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between bg-surface-container-low px-3 py-2.5">
<div class="flex items-center space-x-3">
<span class="font-code text-label-md text-secondary font-medium w-4">二</span>
<span class="font-body-md text-body-md text-primary font-medium">沈一舟</span>
</div>
<div class="flex items-center space-x-2">

<span class="font-code text-body-md text-primary font-bold">+18</span>
</div>
</div>
<div class="flex items-center justify-between bg-surface-container-low px-3 py-2.5">
<div class="flex items-center space-x-3">
<span class="font-code text-label-md text-secondary font-medium w-4">三</span>
<span class="font-body-md text-body-md text-primary font-medium">苏小暖</span>
</div>
<div class="flex items-center space-x-2">

<span class="font-code text-body-md text-secondary font-bold">-12</span>
</div>
</div>
<div class="flex items-center justify-between bg-surface-container-low px-3 py-2.5">
<div class="flex items-center space-x-3">
<span class="font-code text-label-md text-secondary font-medium w-4">四</span>
<span class="font-body-md text-body-md text-primary font-medium">周明远</span>
</div>
<div class="flex items-center space-x-2">

<span class="font-code text-body-md text-secondary font-bold">-41</span>
</div>
</div>
</div>
</div>



</div>
<div class="flex flex-col space-y-2 mt-5">
<button class="w-full bg-primary text-on-primary py-3.5 px-4 font-headline-sm text-headline-sm tracking-wide text-center active:bg-surface-dim transition-colors flex items-center justify-center space-x-2" id="save-btn">
<span class="material-symbols-outlined text-body-lg">download</span>
<span class="">保存战报长图</span>
</button>
<button class="w-full bg-surface-container text-primary py-3.5 px-4 font-headline-sm text-headline-sm tracking-wide text-center active:bg-surface-container-high transition-colors flex items-center justify-center space-x-2" id="share-btn">
<span class="material-symbols-outlined text-body-lg">share</span>
<span class="">分享至微信好友与群聊</span>
</button>
</div>
<div class="opacity-0 pointer-events-none fixed bottom-12 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2 font-body-sm text-body-sm transition-opacity duration-200 z-50" id="toast">
    战报凭证已生成并保存
  </div>
<script>
    (function() {
      const saveBtn = document.getElementById('save-btn');
      const shareBtn = document.getElementById('share-btn');
      const toast = document.getElementById('toast');

      function showFeedback(text) {
        toast.textContent = text;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 1800);
      }

      saveBtn.addEventListener('click', () => {
        showFeedback('对局凭据已保存至相册');
      });

      shareBtn.addEventListener('click', () => {
        showFeedback('已准备好分享海报面板');
      });
    })();
  </script>
</div></main>

</body></html>
